{% load static %}
<header class="site-header">
  <div class="header-inner">
    <a href="{% url 'home' %}" class="logo">
      <img src="{% static 'img/logo.svg' %}" alt="" class="logo-mark">
      <span class="logo-text">
        <span class="logo-name">نِماو</span>
        <span class="logo-tagline">خدمات دیجیتال و طراحی وب</span>
      </span>
    </a>

    <nav class="main-nav" aria-label="ناوبری اصلی">
      <a href="{% url 'home' %}">خانه</a>
      <a href="#">خدمات</a>
      <a href="#">نمونه‌کارها</a>
      <a href="#">درباره ما</a>
      <a href="#">تماس</a>
    </nav>

    <div class="header-actions">
      <a href="#" class="btn btn-sm">دریافت قیمت پروژه</a>
      <button id="theme-toggle" class="icon-btn" aria-label="تغییر پوستهٔ روشن/تاریک">
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="nav-toggle" aria-label="باز و بسته کردن منو" aria-expanded="false" aria-controls="mobile-menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <nav id="mobile-menu" class="mobile-menu" aria-label="منوی موبایل">
    <a href="{% url 'home' %}">خانه</a>
    <a href="#">خدمات</a>
    <a href="#">نمونه‌کارها</a>
    <a href="#">درباره ما</a>
    <a href="#">تماس</a>
    <a href="#" class="btn">دریافت قیمت پروژه</a>
  </nav>
</header>
